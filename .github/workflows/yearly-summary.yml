name: Yearly Summary

on:
  schedule:
    # 每年 1 月 2 号 UTC 00:00 = 北京时间 1 月 2 号 08:00，跑去年全年汇总
    - cron: "0 0 2 1 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_REGION: ${{ secrets.S3_REGION }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      AI_API_BASE: ${{ secrets.AI_API_BASE }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Ensure pip dependencies
        run: |
          pip install requests jieba boto3

      - name: Verify dependencies
        run: |
          python -c "import requests; import jieba; import boto3; print('✅ 所有依赖已安装')"

      - name: Generate Yearly Summary
        run: |
          python scripts/generate_periodic_summary.py --period yearly